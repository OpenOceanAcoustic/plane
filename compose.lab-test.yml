# Overlay the upstream isolated test stack; secrets stay outside test containers.
services:
  test-minio:
    image: ooa-plane-minio:source
    build:
      context: .
      dockerfile: tools/lab/Dockerfile.minio
  api-tests:
    image: ooa-plane-api:lab
    environment:
      LAB_TOTP_KEY_FILE: ""
      LAB_AUTH_ENABLED: "0"
      DJANGO_SETTINGS_MODULE: plane.settings.test
      TZ: Asia/Shanghai
